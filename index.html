<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123a36" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..800&display=swap" rel="stylesheet" />
  <title>Painel de Controle — Organizador Pessoal & Acadêmico</title>
  <style>
        :root {
      --bg: #f3f5f3;
      --surface: #ffffff;
      --surface-2: #f6f8f6;
      --text: #14211f;
      --muted: #5c6c68;
      --line: #dfe5e2;
      --line-strong: #c5cfcb;
      --primary: #0f6b66;
      --primary-dark: #0b524e;
      --primary-2: #2f8f83;
      --primary-soft: #e2f0ee;
      --success: #3b8a4d;
      --success-soft: #e8f3ea;
      --danger: #c0392b;
      --danger-soft: #fbecea;
      --warning: #a8741a;
      --warning-soft: #faf2de;
      --fac: #b5604a; --fac-soft: #f7ebe6; --fac-ink: #8a4332;
      --pes: #e0a800; --pes-soft: #fdf4d3; --pes-ink: #7a5a00;
      --fin: #3b8a4d; --fin-soft: #e6f3e8; --fin-ink: #2a6a39;
      --cat0: #2f7f78; --cat1: #b5604a; --cat2: #b88a3e; --cat3: #6b8f5e; --cat4: #5b7894; --cat5: #8a6f8f; --cat6: #b04a68; --cat7: #9a9a8a;
      --hero-from: #123a36;
      --hero-to: #0b2421;
      --hero-ink: #b5ddd7;
      --shadow: 0 10px 30px rgba(16, 40, 36, .07);
      --shadow-sm: 0 2px 8px rgba(16, 40, 36, .04);
      --radius: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --font-body: "Lexend", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-head: "Lexend", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body.dark-mode {
      --bg: #0d1514;
      --surface: #14201e;
      --surface-2: #1c2a28;
      --text: #e9f1ef;
      --muted: #93a5a1;
      --line: #263634;
      --line-strong: #35494a;
      --primary: #5fc4b8;
      --primary-dark: #45ab9f;
      --primary-2: #8fdccf;
      --primary-soft: #14302d;
      --success: #72cf88;
      --success-soft: #15301b;
      --danger: #f08a7a;
      --danger-soft: #3a1b17;
      --warning: #e6b95c;
      --warning-soft: #3a2f12;
      --fac: #e0957f; --fac-soft: #3a2420; --fac-ink: #efb9a8;
      --pes: #f0c24a; --pes-soft: #3a3010; --pes-ink: #f3d77f;
      --fin: #72cf88; --fin-soft: #15301b; --fin-ink: #a2e3b3;
      --cat0: #5fc4b8; --cat1: #e0957f; --cat2: #e0b35e; --cat3: #9cc58a; --cat4: #86a7c7; --cat5: #b79bbd; --cat6: #dd8aa5; --cat7: #b8b8a8;
      --hero-from: #17413c;
      --hero-to: #0e2623;
      --hero-ink: #a8d8d2;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, .25);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app-shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: 250px 1fr;
    }

    /* Sidebar */
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100dvh;
      padding: 26px 18px;
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(18px);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 28px;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }
    body.dark-mode .sidebar {
      background: rgba(20,32,30, .86);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 2px 8px;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--primary);
      box-shadow: 0 10px 24px rgba(15,107,102,.25);
      font-size: 21px;
    }
    .brand strong { display: block; font-size: 15px; letter-spacing: -.02em; }
    .brand span { color: var(--muted); font-size: 12px; }

    .nav { display: grid; gap: 6px; }
    .nav-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 13px;
      border-radius: 13px;
      text-align: left;
      transition: .2s ease;
    }
    .nav-btn:hover { background: var(--surface-2); color: var(--text); }
    .nav-btn.active { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
    .nav-icon { width: 20px; text-align: center; font-size: 17px; }

    .sidebar-footer {
      margin-top: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface-2);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sidebar-footer small { color: var(--muted); line-height: 1.4; }
    .backup-actions { display: flex; gap: 6px; }
    .backup-btn {
      flex: 1;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      text-align: center;
      transition: .2s ease;
    }
    .backup-btn:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }

    /* Main */
    .main { min-width: 0; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 24px 34px;
      border-bottom: 1px solid var(--line);
      background: rgba(243,245,243,.78);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 5;
      transition: background-color 0.25s ease;
    }
    body.dark-mode .topbar {
      background: rgba(16,40,36, .78);
    }
    .mobile-brand { display: none; align-items: center; gap: 9px; font-weight: 800; }
    .mobile-brand-mark {
      width: 34px; height: 34px; border-radius: 11px; color: white;
      background: var(--primary);
      display: grid; place-items: center;
    }
    .header-actions { display: flex; gap: 9px; align-items: center; }
    .icon-btn, .secondary-btn, .primary-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 12px;
      height: 42px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: .2s ease;
      box-shadow: 0 2px 6px rgba(16,40,36,.03);
    }
    .icon-btn { width: 42px; padding: 0; }
    .icon-btn:hover, .secondary-btn:hover { transform: translateY(-1px); box-shadow: 0 7px 16px rgba(16,40,36,.07); }
    .primary-btn {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
      font-weight: 700;
      box-shadow: 0 9px 20px rgba(15,107,102,.2);
    }
    .primary-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .content { max-width: 1220px; margin: 0 auto; padding: 34px; }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    .eyebrow {
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 7px;
    }
    h1 { font-size: clamp(28px, 4vw, 40px); letter-spacing: -.045em; margin: 0; }
    .subtitle { margin: 8px 0 0; color: var(--muted); }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(16,40,36,.03);
    }
    .stat-top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .stat-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .stat-icon {
      width: 32px; height: 32px; border-radius: 10px; display:grid; place-items:center;
      background: var(--primary-soft); color: var(--primary);
    }
    .stat-value { margin-top: 9px; font-size: 27px; font-weight: 850; letter-spacing: -.04em; }
    .stat-note { margin-top: 4px; color: var(--muted); font-size: 12px; }

    .dashboard {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(280px, .75fr);
      gap: 18px;
      align-items: start;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .overview-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(16,40,36,.03);
      text-align: left;
      cursor: pointer;
      transition: .15s ease;
    }
    .overview-card:hover { border-color: var(--primary); transform: translateY(-1px); }
    .overview-card-head { display:flex; align-items:center; gap:9px; margin-bottom:10px; }
    .overview-card-head h3 { margin:0; font-size:14px; letter-spacing:-.01em; }
    .overview-icon {
      width: 30px; height: 30px; border-radius: 9px; display:grid; place-items:center;
      background: var(--primary-soft); font-size: 15px;
    }
    .overview-line { margin: 0; font-size: 13px; font-weight: 700; line-height:1.4; }
    .overview-line.muted { color: var(--muted); font-weight: 600; font-size: 12px; margin-top: 4px; }

    .agenda-day-row {
      display:flex; gap:12px; align-items:flex-start; padding:13px 9px; border-top:1px solid var(--line);
    }
    .agenda-day-row:first-child { border-top:0; }
    .agenda-day-label { min-width:70px; font-weight:800; font-size:12.5px; color:var(--primary); padding-top:3px; }
    .agenda-day-items { display:flex; flex-wrap:wrap; gap:6px; }

    .quick-actions { display:flex; flex-wrap:wrap; gap:10px; padding: 0 21px 21px; }
    .focus-panel { border: 1px solid var(--primary); box-shadow: 0 12px 30px rgba(15,107,102,.10); background: linear-gradient(180deg, var(--surface), var(--primary-soft)); }
    .focus-panel .panel-header { border-bottom: 1px solid rgba(15,107,102,.20); }

    .focus-row { display:flex; align-items:center; gap:12px; padding:13px 9px; border-top:1px solid var(--line); }
    .focus-row:first-child { border-top:0; }
    .focus-text { font-size:13.5px; font-weight:600; }

    @media (max-width: 900px) {
      .overview-grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel-header {
      display:flex; align-items:center; justify-content:space-between; gap: 14px;
      padding: 20px 21px 15px;
    }
    .panel-title { margin:0; font-size: 17px; letter-spacing: -.02em; }
    .panel-subtitle { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .task-list { padding: 0 12px 12px; }
    .task {
      display:grid;
      grid-template-columns: 24px minmax(0,1fr) auto;
      gap: 11px;
      align-items: center;
      padding: 13px 9px;
      border-top: 1px solid var(--line);
    }
    .task:first-child { border-top: 0; }
    .check {
      width: 22px; height: 22px; border-radius: 8px; border: 1.5px solid var(--line-strong);
      background: white; display:grid; place-items:center; color: white; padding:0;
      transition: .18s ease;
    }
    body.dark-mode .check { background: var(--surface); border-color: var(--line); }
    .check:hover { border-color: var(--primary); }
    .check.done { border-color: var(--success); background: var(--success); color: white; }
    .task-main { min-width: 0; }
    .task-title {
      margin:0; font-size: 14px; line-height:1.35; font-weight: 700;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .task.completed .task-title { color: var(--muted); text-decoration: line-through; }
    .task-meta { display:flex; flex-wrap:wrap; gap: 7px; margin-top:5px; }
    .badge {
      display:inline-flex; align-items:center; gap:5px; padding: 4px 7px;
      border-radius: 999px; background: var(--surface-2); color: var(--muted);
      font-size: 11px; font-weight:700;
    }
    .badge.priority-high { background: var(--danger-soft); color: var(--danger); }
    .badge.priority-medium { background: var(--warning-soft); color: var(--warning); }
    .badge.today { background: var(--primary-soft); color: var(--primary); }
    .badge.attendance-good { background: var(--success-soft); color: var(--success); }
    .badge.attendance-warn { background: var(--warning-soft); color: var(--warning); }
    .badge.attendance-danger { background: var(--danger-soft); color: var(--danger); }
    .badge.overdue { background: var(--danger-soft); color: var(--danger); }
    .badge.delivery-pending { background: var(--warning-soft); color: var(--warning); }
    .badge.delivery-done { background: var(--success-soft); color: var(--success); }
    .badge.delivery-not { background: var(--danger-soft); color: var(--danger); }
    .badge.delivery-na { background: var(--surface-2); color: var(--muted); }
    .task.overdue:not(.completed) { border-left: 3px solid var(--danger); padding-left: 6px; }

    .task-actions { display:flex; gap:5px; }
    .mini-btn {
      width: 32px; height:32px; padding:0; border:0; border-radius:9px; background:transparent;
      color: var(--muted); display:grid; place-items:center; transition: .15s ease;
    }
    .mini-btn:hover { background: var(--surface-2); color: var(--text); }
    .mini-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }

    .side-card { padding-bottom: 8px; }
    .progress-wrap { padding: 4px 21px 21px; }
    .progress-head { display:flex; justify-content:space-between; color: var(--muted); font-size:12px; font-weight:700; }
    .progress {
      height: 9px; border-radius:99px; overflow:hidden; background: var(--surface-2); margin-top:10px;
    }
    .progress > span { display:block; height:100%; border-radius:99px; background: linear-gradient(90deg,var(--primary),var(--primary-2)); width:0%; transition:.35s ease; }
    .quote {
      margin: 0 21px 18px; padding: 15px; border-radius: 15px; background: var(--primary-soft);
      color: var(--primary); font-size: 13px; line-height:1.55; font-weight: 500;
    }

    /* Faculdade — painel acadêmico */
    .faculty-summary {
      display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:18px;
    }
    .faculty-kpi {
      background:var(--surface); border:1px solid var(--line); border-radius:18px;
      padding:16px; box-shadow:0 4px 15px rgba(16,40,36,.03);
    }
    .faculty-kpi .kpi-label { color:var(--muted); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; }
    .faculty-kpi .kpi-value { margin-top:7px; font-size:26px; font-weight:850; letter-spacing:-.04em; }
    .faculty-kpi .kpi-note { margin-top:3px; color:var(--muted); font-size:11px; }

    .faculty-nav {
      display:flex; gap:7px; overflow-x:auto; padding:5px; margin-bottom:16px;
      background:var(--surface-2); border:1px solid var(--line); border-radius:15px;
      scrollbar-width:none;
    }
    .faculty-nav::-webkit-scrollbar { display:none; }
    .faculty-tab {
      border:0; background:transparent; color:var(--muted); padding:10px 14px;
      border-radius:10px; font-size:12px; font-weight:800; white-space:nowrap; transition: .2s ease;
    }
    .faculty-tab.active { background:var(--surface); color:var(--primary); box-shadow:0 2px 8px rgba(16,40,36,.06); }

    .faculty-pane { display:none; }
    .faculty-pane.active { display:block; }

    .course-grid {
      display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px;
    }
    .course-card {
      position:relative; background:var(--surface); border:1px solid var(--line);
      border-radius:20px; padding:18px; box-shadow:var(--shadow); cursor:pointer;
      transition:.2s ease; overflow:hidden;
    }
    .course-card:hover { transform:translateY(-2px); box-shadow:0 20px 44px rgba(16,40,36,.10); }
    .course-syllabus { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:12.5px; color:var(--text); }
    .course-syllabus strong { display:block; margin-bottom:6px; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    .course-syllabus p { margin:0; line-height:1.6; max-height:260px; overflow-y:auto; white-space:pre-wrap; }
    .course-card.selected { outline: 2px solid var(--primary); outline-offset: -1px; }
    .course-card::before { content:""; position:absolute; inset:0 auto 0 0; width:4px; background:linear-gradient(180deg,var(--primary),var(--primary-2)); }
    .course-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .course-code { color:var(--primary); font-size:10px; font-weight:850; letter-spacing:.06em; text-transform:uppercase; }
    .course-name { margin:4px 0 0; font-size:16px; font-weight:800; letter-spacing:-.02em; }
    .course-teacher { margin-top:5px; color:var(--muted); font-size:11px; }
    .course-badges { display:flex; flex-wrap:wrap; gap:6px; margin-top:13px; }
    .course-schedule { margin-top:14px; padding-top:13px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; line-height:1.6; }
    .course-schedule strong { color:var(--text); }
    .course-actions { display:flex; gap:5px; margin-top:13px; }
    .course-actions .mini-btn { background:var(--surface-2); }

    .grade-layout { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr); gap:16px; }
    .course-detail {
      background:linear-gradient(145deg,var(--hero-from),var(--hero-to)); color:#fff; border-radius:20px; padding:21px;
      box-shadow:var(--shadow); min-height:230px;
    }
    .course-detail .eyebrow { color:var(--hero-ink); }
    .course-detail h2 { margin:4px 0 5px; font-size:24px; letter-spacing:-.035em; color: #fff; }
    .course-detail p { margin:0; color:var(--line-strong); font-size:12px; line-height:1.55; }
    .detail-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:18px; }
    .detail-stat { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:10px; }
    .detail-stat small { display:block; color:var(--line-strong); font-size:10px; }
    .detail-stat strong { display:block; margin-top:3px; font-size:17px; color: #fff; }

    .table-wrap { overflow-x: auto; }
    .data-table, .grade-table { width:100%; border-collapse:collapse; }
    .data-table th, .data-table td, .grade-table th, .grade-table td { padding:11px 12px; border-top:1px solid var(--line); text-align:left; font-size:12px; }
    .data-table th, .grade-table th { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.05em; }
    .grade-empty { padding:28px 16px; text-align:center; color:var(--muted); }

    .faculty-table-card { background:var(--surface); border:1px solid var(--line); border-radius:20px; overflow:hidden; box-shadow:var(--shadow); }
    .faculty-table-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:18px 18px 13px; }
    .faculty-table-head h2 { margin:0; font-size:16px; }
    .faculty-table-head p { margin:4px 0 0; color:var(--muted); font-size:11px; }
    .attendance-bar { height:7px; width:70px; background:var(--surface-2); border-radius:99px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:6px; }
    .attendance-bar span { display:block; height:100%; border-radius:99px; }
    .attendance-good-bg { background:var(--success); }
    .attendance-warn-bg { background:var(--warning); }
    .attendance-danger-bg { background:var(--danger); }

    .reading-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .reading-card { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:17px; box-shadow:0 4px 15px rgba(16,40,36,.03); }
    .reading-card h3 { margin:0; font-size:14px; }
    .reading-card p { margin:5px 0 0; color:var(--muted); font-size:11px; }
    .reading-numbers { display:flex; justify-content:space-between; margin-top:14px; font-size:11px; color:var(--muted); }
    .reading-numbers strong { color:var(--text); }

  /* ======================================================================
     OTIMIZAÇÃO PARA TABLET (iPad / Android Tablet) — layout, toque e leitura
     Estas regras não alteram nenhuma lógica de JS, apenas aparência/layout.
     ====================================================================== */

  /* --- Segurança de rolagem/zoom em telas de toque --- */
  html { -webkit-text-size-adjust: 100%; }
  body { overscroll-behavior-y: contain; }

  /* --- Camada de layout: tablets em retrato e paisagem (ex.: iPad 768–1180px) --- */
  @media (min-width: 601px) and (max-width: 1180px) {
    .content { max-width: 980px; padding: 28px 26px 108px; }
    .overview-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .dashboard { grid-template-columns: 1fr; }
    .filters { grid-template-columns: 1fr 1fr; }
    .filters .search { grid-column: 1/-1; }
    .form-grid { grid-template-columns: 1fr 1fr; }
    .semester-info { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }
  }

  /* --- Tablets grandes/paisagem que ainda usam a barra lateral (≥901px) --- */
  @media (min-width: 901px) and (max-width: 1180px) {
    .app-shell { grid-template-columns: 92px 1fr; }
    .sidebar { padding: 22px 10px; align-items: center; }
    .brand { flex-direction: column; text-align: center; gap: 6px; padding: 0; }
    .brand span, .brand strong { display: none; }
    .nav-btn { flex-direction: column; justify-content: center; gap: 4px; padding: 12px 4px; font-size: 10px; text-align: center; }
    .nav-icon { font-size: 19px; }
  }

  /* --- Área de toque confortável (qualquer tela sensível ao toque: iPad, Android) --- */
  @media (pointer: coarse) {
    .nav-btn { min-height: 48px; }
    .icon-btn, .secondary-btn, .primary-btn { min-height: 44px; }
    .icon-btn { width: 44px; }
    .mini-btn { width: 40px; height: 40px; }
    .check { width: 26px; height: 26px; }
    .backup-btn { min-height: 40px; padding: 9px 8px; font-size: 12px; }
    .day-check { padding: 10px 13px; min-height: 44px; }
    .day-check input[type="checkbox"] { width: 18px; height: 18px; }
    .checklist-row .check, .task .check { width: 26px; height: 26px; }
    .finance-tab, .personal-tab, .faculty-tab { min-height: 44px; padding: 11px 15px; }
    .modal-actions button { min-height: 46px; }

    /* Campos de formulário, notas e diário — mais espaço para digitação/caneta */
    .field, select.field { min-height: 46px; font-size: 16px; }
    textarea.field { min-height: 140px; padding: 14px; font-size: 16px; line-height: 1.6; }
    #notesInput, textarea[name="text"], textarea[name="notes"], textarea[name="description"] {
      min-height: 160px;
    }

    /* Barra de navegação inferior (retrato) com alvo de toque maior para o polegar */
    .bottom-nav { grid-template-columns: repeat(5, 1fr); padding: 9px 6px calc(9px + env(safe-area-inset-bottom)); }
    .bottom-nav .nav-btn { min-height: 56px; padding: 8px 3px; font-size: 10.5px; gap: 3px; }
    .bottom-nav .nav-icon { font-size: 18px; }
  }

  /* --- Barra lateral fixa também respeita a área segura em tablets com notch --- */
  .sidebar { padding-left: max(18px, env(safe-area-inset-left)); }
  .bottom-nav { padding-left: max(7px, env(safe-area-inset-left)); padding-right: max(7px, env(safe-area-inset-right)); }

  /* ======================================================================
     v17 — AJUSTES DE RESPONSIVIDADE (celular + tablet)
     ====================================================================== */

  /* Nada estoura a largura da tela */
  img, video, canvas, table, pre { max-width: 100%; }
  .content, .view, .panel, .modal { min-width: 0; }
  .table-wrap, .finance-table-wrap, .weekly-schedule { -webkit-overflow-scrolling: touch; }

  /* Grupo de botoes do cabecalho */
  .hero-actions { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }

  /* Barra superior e conteudo respeitam notch/ilha */
  .topbar { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

  /* Abas roláveis com "encaixe" no toque */
  .faculty-nav, .finance-tabs, .personal-tabs { scroll-snap-type: x proximity; }

  .faculty-tab, .finance-tab, .personal-tab { scroll-snap-align: start; }

    /* ===== Camada de harmonia visual ===== */
    body { font-size: 15px; line-height: 1.5; font-feature-settings: "tnum" 1; }
    h1, h2, .panel-title, .stat-value, .brand strong, .personal-section-intro h2 {
      font-family: var(--font-head); font-weight: 700; letter-spacing: -.02em;
    }
    h1 { font-weight: 800; letter-spacing: -.03em; }
    .eyebrow { text-transform: none; letter-spacing: .01em; font-size: 13px; font-weight: 700; }
    .stat-value { font-weight: 700; letter-spacing: -.03em; }

    /* escala única de raios e sombras */
    .panel, .stat, .overview-card, .personal-item-card, .reminder-group-card,
    .agenda-day-card, .personal-list-panel, .inbox-card, .course-card {
      border-radius: var(--radius); box-shadow: var(--shadow-sm);
    }
    .panel { box-shadow: var(--shadow); }
    .field, .icon-btn, .secondary-btn, .primary-btn, .nav-btn, .calendar-cell { border-radius: var(--radius-md); }
    .badge { font-weight: 700; padding: 4px 9px; }

    /* navegação lateral */
    .brand-mark { border-radius: 12px; box-shadow: none; background: var(--primary); }
    .mobile-brand-mark { background: var(--primary); }
    .nav-btn { position: relative; font-weight: 600; }
    .nav-btn.active { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
    .nav-btn.active::before {
      content: ""; position: absolute; left: -18px; top: 10px; bottom: 10px; width: 4px;
      border-radius: 0 4px 4px 0; background: var(--primary);
    }
    .sidebar-footer { border-radius: var(--radius-md); background: var(--surface-2); }

    /* botões */
    .primary-btn { box-shadow: none; }
    .primary-btn:hover { background: var(--primary-dark); box-shadow: 0 6px 14px rgba(15,107,102,.22); }
    body.dark-mode .primary-btn { color: #0d1514; }
    .icon-btn, .secondary-btn { box-shadow: none; }
    .icon-btn:hover, .secondary-btn:hover { background: var(--surface-2); box-shadow: none; transform: none; }
    .overview-card:hover { transform: none; box-shadow: var(--shadow); }

    /* foco visível e movimento reduzido */
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; scroll-behavior: auto !important; }
    }
    @media (max-width: 560px) {
      .nav-btn.active::before { display: none; }
    }

    /* ===== Início: cards de resumo ===== */
    .overview-grid { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 22px; }
    .overview-card {
      --acc: var(--primary); --acc-soft: var(--primary-soft);
      position: relative; display: flex; flex-direction: column; gap: 14px;
      padding: 18px 20px 20px; border-radius: var(--radius); border: 1px solid var(--line);
      background: var(--surface); box-shadow: var(--shadow-sm); cursor: pointer; overflow: hidden;
      transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
    }
    .overview-card::before {
      content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--acc);
      opacity: .85;
    }
    .ov-personal { --acc: var(--warning); --acc-soft: var(--warning-soft); }
    .ov-finance  { --acc: var(--success); --acc-soft: var(--success-soft); }
    .overview-card:hover { transform: translateY(-2px); border-color: var(--acc); box-shadow: var(--shadow); }
    .overview-card:active { transform: translateY(0); }
    .overview-card:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; }
    .ov-head { display: flex; align-items: center; gap: 11px; }
    .ov-head h3 { margin: 0; flex: 1; font-family: var(--font-head); font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
    .ov-icon {
      width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
      background: var(--acc-soft); font-size: 18px;
    }
    .ov-arrow {
      color: var(--muted); flex-shrink: 0; padding: 7px; box-sizing: content-box; margin: -7px;
      border-radius: 50%; transition: color .2s ease, background-color .2s ease, transform .2s ease;
    }
    .overview-card:hover .ov-arrow, .overview-card:focus-visible .ov-arrow {
      color: var(--acc); background: var(--acc-soft); transform: translateX(2px);
    }
    .ov-row { display: flex; flex-direction: column; gap: 2px; }
    .ov-row + .ov-row { padding-top: 12px; border-top: 1px solid var(--line); }
    .ov-label { font-size: 12px; font-weight: 600; color: var(--muted); }
    .ov-value { font-size: 16px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em; overflow-wrap: anywhere; }
    .ov-finance .ov-value { font-family: var(--font-head); font-size: 22px; }
    .ov-sub { font-size: 14px; font-weight: 600; color: var(--text); }
    @media (hover: none) { .overview-card:hover { transform: none; } }

    /* ===== Início: cores por área, topo e "Essa semana" ===== */
    .overview-card.ov-faculty  { --acc: var(--fac); --acc-soft: var(--fac-soft); --acc-ink: var(--fac-ink); }
    .overview-card.ov-personal { --acc: var(--pes); --acc-soft: var(--pes-soft); --acc-ink: var(--pes-ink); }
    .overview-card.ov-finance  { --acc: var(--fin); --acc-soft: var(--fin-soft); --acc-ink: var(--fin-ink); }
    .overview-card:hover .ov-arrow, .overview-card:focus-visible .ov-arrow { color: var(--acc-ink); }

    .hero { align-items: center; flex-wrap: wrap; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .hero-actions .secondary-btn { height: 36px; padding: 0 13px; font-size: 13px; font-weight: 600; border-radius: var(--radius-md); }

    .wk-fac { --c: var(--fac); --cs: var(--fac-soft); --ci: var(--fac-ink); }
    .wk-pes { --c: var(--pes); --cs: var(--pes-soft); --ci: var(--pes-ink); }
    .wk-fin { --c: var(--fin); --cs: var(--fin-soft); --ci: var(--fin-ink); }
    .wk-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: flex-end; }
    .wk-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--muted); }
    .wk-chip::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
